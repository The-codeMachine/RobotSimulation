name: Documentation Improvement
description: Report missing, unclear, outdated, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation!

        Please describe what is missing, unclear, outdated, or incorrect.

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Where is the documentation that needs improvement?
      placeholder: "README.md, class documentation, CONTRIBUTING.md, etc."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
      description: Describe what is unclear, missing, outdated, or incorrect.
      placeholder: |
        The documentation currently says...
        It would be clearer if...
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed Improvement
      description: If you have an idea for how the documentation could be improved, describe it here.
      placeholder: |
        Add an example showing...
        Clarify the explanation of...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Include examples, links, screenshots, or anything else that may help.
      placeholder: "Any additional information..."
    validations:
      required: false